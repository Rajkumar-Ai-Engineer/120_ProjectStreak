<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">CIFAR-10 Image Generation with a Deep Convolutional GAN — High-Level System Architecture</title>
  <desc id="description">A high-level architecture flow diagram for CIFAR-10 image generation using a Deep Convolutional GAN, based on the project's Mermaid flowchart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#193b68"/>
      <stop offset="1" stop-color="#286b8d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1d3553" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#59738f"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .node { filter: url(#shadow); }
      .label { fill: #18324f; font-size: 22px; font-weight: 650; text-anchor: middle; }
      .edge { fill: none; stroke: #59738f; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="46" y="38" width="1508" height="150" rx="24" fill="url(#header)"/>
  <text x="800" y="105" fill="#ffffff" font-size="38" font-weight="750" text-anchor="middle">CIFAR-10 Image Generation with a Deep Convolutional GAN</text>
  <text x="800" y="151" fill="#d9e9f4" font-size="22" font-weight="500" letter-spacing="1.2" text-anchor="middle">High-Level System Architecture</text>

  <!-- Connections: preserve the supplied Mermaid flow directions. -->
  <g class="edge">
    <path d="M 340 300 H 405"/>
    <path d="M 655 300 H 720"/>
    <path d="M 340 485 H 405"/>
    <path d="M 655 485 H 720"/>
    <path d="M 850 350 C 900 390, 930 435, 1005 470"/>
    <path d="M 980 485 H 1005"/>
    <path d="M 1150 545 V 620 H 220 V 680"/>
    <path d="M 370 730 H 580"/>
    <path d="M 850 730 H 1060"/>
  </g>

  <!-- Nodes -->
  <g class="node">
    <rect x="90" y="255" width="250" height="90" rx="18" fill="#e6f2fb" stroke="#80b6d9" stroke-width="2"/>
    <text class="label" x="215" y="309">CIFAR-10 images</text>
  </g>
  <g class="node">
    <rect x="405" y="255" width="250" height="90" rx="18" fill="#e8f4f3" stroke="#80bdb4" stroke-width="2"/>
    <text class="label" x="530" y="296"><tspan x="530">Normalize to</tspan><tspan x="530" dy="27">-1..1</tspan></text>
  </g>
  <g class="node">
    <rect x="720" y="255" width="260" height="90" rx="18" fill="#e6f2fb" stroke="#80b6d9" stroke-width="2"/>
    <text class="label" x="850" y="296"><tspan x="850">Real image</tspan><tspan x="850" dy="27">batches</tspan></text>
  </g>
  <g class="node">
    <rect x="90" y="440" width="250" height="90" rx="18" fill="#f0ebfb" stroke="#a998d5" stroke-width="2"/>
    <text class="label" x="215" y="481"><tspan x="215">100-D random</tspan><tspan x="215" dy="27">noise</tspan></text>
  </g>
  <g class="node">
    <rect x="405" y="440" width="250" height="90" rx="18" fill="#f0ebfb" stroke="#a998d5" stroke-width="2"/>
    <text class="label" x="530" y="494">Generator</text>
  </g>
  <g class="node">
    <rect x="720" y="440" width="260" height="90" rx="18" fill="#f0ebfb" stroke="#a998d5" stroke-width="2"/>
    <text class="label" x="850" y="481"><tspan x="850">Fake 32x32 RGB</tspan><tspan x="850" dy="27">images</tspan></text>
  </g>
  <g class="node">
    <rect x="1005" y="435" width="290" height="110" rx="20" fill="#fff2df" stroke="#e3b76d" stroke-width="2.5"/>
    <text class="label" x="1150" y="499">Discriminator</text>
  </g>
  <g class="node">
    <rect x="70" y="680" width="300" height="100" rx="20" fill="#fff2df" stroke="#e3b76d" stroke-width="2"/>
    <text class="label" x="220" y="722"><tspan x="220">Adversarial</tspan><tspan x="220" dy="28">losses</tspan></text>
  </g>
  <g class="node">
    <rect x="580" y="680" width="270" height="100" rx="20" fill="#e8f4f3" stroke="#80bdb4" stroke-width="2"/>
    <text class="label" x="715" y="722"><tspan x="715">Update generator</tspan><tspan x="715" dy="28">and discriminator</tspan></text>
  </g>
  <g class="node">
    <rect x="1060" y="680" width="390" height="100" rx="20" fill="#e6f2fb" stroke="#80b6d9" stroke-width="2"/>
    <text class="label" x="1255" y="722"><tspan x="1255">Generated sample grids</tspan><tspan x="1255" dy="28">and checkpoints</tspan></text>
  </g>
</svg>
