<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Brain Tumour MRI Image Classification with VGG19 Transfer Learning — High-Level System Architecture</title>
  <desc id="desc">Architecture diagram showing Brain MRI class folders flowing through an image generator, augmentation and rescaling, VGG19 pretrained backbone, trainable upper layers, and a Dense softmax class head. The head outputs a predicted MRI dataset class and a vggmodel.h5 checkpoint.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9ff"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#526581"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node-title { font-size: 23px; font-weight: 650; fill: #172554; text-anchor: middle; }
      .flow { fill: none; stroke: #526581; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect x="0" y="0" width="1920" height="270" fill="url(#header)"/>
  <circle cx="1770" cy="42" r="190" fill="#ffffff" opacity="0.035"/>
  <circle cx="1685" cy="188" r="115" fill="#93c5fd" opacity="0.06"/>
  <text x="960" y="112" fill="#ffffff" font-size="42" font-weight="750" text-anchor="middle">Brain Tumour MRI Image Classification with VGG19 Transfer Learning</text>
  <text x="960" y="174" fill="#c7d8ff" font-size="27" font-weight="500" letter-spacing="1.3" text-anchor="middle">High-Level System Architecture</text>
  <rect x="866" y="204" width="188" height="5" rx="2.5" fill="#60a5fa"/>

  <!-- Directed data flow: source through model head -->
  <path class="flow" d="M 370 475 H 484"/>
  <path class="flow" d="M 770 475 H 884"/>
  <path class="flow" d="M 1170 475 H 1284"/>
  <path class="flow" d="M 1425 535 V 665"/>
  <path class="flow" d="M 1280 725 H 1170"/>
  <path class="flow" d="M 900 725 H 820 V 655 H 770"/>
  <path class="flow" d="M 900 725 H 820 V 805 H 770"/>

  <!-- Architecture components -->
  <g filter="url(#shadow)">
    <rect x="90" y="415" width="280" height="120" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
    <rect x="90" y="415" width="9" height="120" rx="4.5" fill="#3b82f6"/>
    <text class="node-title" x="230" y="484"><tspan x="230">Brain MRI class</tspan><tspan x="230" dy="30">folders</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="415" width="280" height="120" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
    <rect x="490" y="415" width="9" height="120" rx="4.5" fill="#3b82f6"/>
    <text class="node-title" x="630" y="484"><tspan x="630">224x224 image</tspan><tspan x="630" dy="30">generator</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="890" y="415" width="280" height="120" rx="20" fill="#ffffff" stroke="#a5b4fc" stroke-width="2.5"/>
    <rect x="890" y="415" width="9" height="120" rx="4.5" fill="#6366f1"/>
    <text class="node-title" x="1030" y="484"><tspan x="1030">Augmentation and</tspan><tspan x="1030" dy="30">rescaling</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1290" y="415" width="280" height="120" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="1290" y="415" width="9" height="120" rx="4.5" fill="#8b5cf6"/>
    <text class="node-title" x="1430" y="484"><tspan x="1430">VGG19 pretrained</tspan><tspan x="1430" dy="30">backbone</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1290" y="665" width="280" height="120" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="1290" y="665" width="9" height="120" rx="4.5" fill="#8b5cf6"/>
    <text class="node-title" x="1430" y="734"><tspan x="1430">Trainable upper</tspan><tspan x="1430" dy="30">layers</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="890" y="665" width="280" height="120" rx="20" fill="#ffffff" stroke="#f0abfc" stroke-width="2.5"/>
    <rect x="890" y="665" width="9" height="120" rx="4.5" fill="#c026d3"/>
    <text class="node-title" x="1030" y="734"><tspan x="1030">Dense softmax</tspan><tspan x="1030" dy="30">class head</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="595" width="280" height="120" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2.5"/>
    <rect x="490" y="595" width="9" height="120" rx="4.5" fill="#16a34a"/>
    <text class="node-title" x="630" y="649"><tspan x="630">Predicted MRI</tspan><tspan x="630" dy="29">dataset class</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="745" width="280" height="120" rx="20" fill="#ffffff" stroke="#fcd34d" stroke-width="2.5"/>
    <rect x="490" y="745" width="9" height="120" rx="4.5" fill="#d97706"/>
    <text class="node-title" x="630" y="814">vggmodel.h5 checkpoint</text>
  </g>

  <text x="960" y="1010" fill="#718096" font-size="18" font-weight="500" text-anchor="middle">Brain Tumour MRI Image Classification · Project 002 · Deep Learning</text>
</svg>
